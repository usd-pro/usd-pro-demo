<html lang="es-AR"><head><meta charset="utf-8">
<title>USD Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="USD Pro">
<meta name="theme-color" content="#0F2A44">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>/* Concepto: app de pagos en un marco de teléfono (390 px); a pantalla completa en el celular.
   Diseño tomado de la imagen de la presentación: tarjeta de saldo en verde profundo, grilla de acciones
   en tarjetas blancas con íconos de trazo verde, selector de cuenta por país y "Mis cuentas".
   El azul del deck queda para el operador y lo destacado. */
:root {
  --stage: #E3E9EF;
  --bg: #F4F7FA;
  --surface: #FFFFFF;
  --surface-2: #EDF2F7;
  --line: #D8E2EC;
  --ink: #0F2A44;
  --ink-2: #4C5E72;
  --blue: #1565C0;
  --star: #D99A00;
  --star-fill: #F7C600;
  --brand-grad: linear-gradient(135deg, #0B4A25 0%, #11632F 55%, #1F7A3A 100%);
  --green: #1F7A3A;
  --green-deep: #0B4A25;
  --green-on: #FFFFFF;
  --green-text: #1F7A3A;
  --green-tint: #E1F1E5;
  --blue-tint: #EAF2FB;
  --blue-line: #2F72C7;
  --blue-ink: #1255A6;
  --amber-bg: #FFF4D6;
  --amber-line: #C58A00;
  --amber-ink: #5A3E00;
  --red: #B3261E;
  --red-tint: #FCE8E6;
  --banner-bg: #0F2A44;
  --banner-ink: #F3F6F2;
  --shadow: 0 1px 2px rgba(15, 42, 68, .06), 0 6px 18px rgba(15, 42, 68, .07);
  --shadow-phone: 0 18px 50px rgba(16, 40, 24, .22);
  --map-land: #E6EEDD; --map-field: #D8E6CB; --map-river: #A8D0EA; --map-road: #FFFFFF; --map-casing: #C9D1C2; --map-town: #EFEADD; --map-label: #5B6757;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #090D12; --bg: #10161D; --surface: #18212B; --surface-2: #202B37; --line: #2E3B49;
    --ink: #EDF2F8; --ink-2: #AEBBCB; --green: #23823F; --green-text: #6FCF8C; --green-tint: #1A3322;
    --blue: #8DB8F0; --star: #F2C230; --star-fill: #F2C230; --blue-tint: #15243A; --blue-line: #6B9BE0; --blue-ink: #A9C6F2;
    --amber-bg: #33270A; --amber-line: #D9A21B; --amber-ink: #FBE3A4;
    --red: #FF8A80; --red-tint: #3A1816; --banner-bg: #1B2A3A; --banner-ink: #F3F6F2;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-phone: 0 18px 50px rgba(0, 0, 0, .55);
    --map-land: #18211A; --map-field: #1F2D20; --map-river: #1D3A4D; --map-road: #3A4638; --map-casing: #0E130E; --map-town: #262920; --map-label: #9DAA98;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #090D12; --bg: #10161D; --surface: #18212B; --surface-2: #202B37; --line: #2E3B49;
  --ink: #EDF2F8; --ink-2: #AEBBCB; --green: #23823F; --green-text: #6FCF8C; --green-tint: #1A3322;
  --blue: #8DB8F0; --star: #F2C230; --star-fill: #F2C230; --blue-tint: #15243A; --blue-line: #6B9BE0; --blue-ink: #A9C6F2;
  --amber-bg: #33270A; --amber-line: #D9A21B; --amber-ink: #FBE3A4;
  --red: #FF8A80; --red-tint: #3A1816; --banner-bg: #1B2A3A; --banner-ink: #F3F6F2;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-phone: 0 18px 50px rgba(0, 0, 0, .55);
  --map-land: #18211A; --map-field: #1F2D20; --map-river: #1D3A4D; --map-road: #3A4638; --map-casing: #0E130E; --map-town: #262920; --map-label: #9DAA98;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--stage); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue-line); outline-offset: 2px; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.stage { height: 100%; display: grid; place-items: center; }
#root { height: 100%; }
.phone { position: relative; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 521px) {
  .stage { padding: 16px; }
  .phone { width: 390px; height: min(860px, 100%); border-radius: 38px; border: 1px solid var(--line); box-shadow: var(--shadow-phone); }
}

.banner { flex: none; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--banner-bg); color: var(--banner-ink); font-size: 12.5px; font-weight: 700; letter-spacing: .04em; }
.banner span { flex: 1; min-width: 0; }
.banner button { flex: none; min-height: 44px; padding: 0 4px; background: none; border: 0; color: var(--banner-ink); font-size: 14px; font-weight: 600; letter-spacing: 0; text-decoration: underline; text-underline-offset: 3px; }

.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.head { flex: none; padding-top: 10px; padding-bottom: 6px; }
.head h1 { margin: 2px 0 0; }
.head-home { display: flex; align-items: center; gap: 10px; padding-top: 12px; }
.body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-top: 8px; padding-bottom: 20px; }
.body > * { flex: none; }

h1 { font-weight: 800; font-size: 27px; line-height: 1.15; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h2 { font-weight: 800; font-size: 20px; letter-spacing: -.01em; margin: 6px 0 0; }
.lead { font-size: 18px; color: var(--ink-2); margin: 0; }
.center { text-align: center; }
.note { margin: 0; font-size: 16px; color: var(--ink-2); }
.eyebrow { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }

.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 24px; letter-spacing: -.03em; color: var(--ink); white-space: nowrap; }
.logo-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--green); color: #fff; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .25); }
.opline { min-width: 0; display: flex; flex-direction: column; justify-content: center; padding-left: 10px; border-left: 1px solid var(--line); color: var(--blue); line-height: 1.15; }
.opline small { font-size: 13px; font-weight: 500; }
.opline b { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { margin-left: auto; flex: none; width: 48px; height: 48px; display: grid; place-items: center; background: none; border: 0; border-radius: 14px; color: var(--ink); }

.back { display: inline-flex; align-items: center; gap: 4px; min-height: 48px; margin-left: -8px; padding: 0 12px 0 6px; background: none; border: 0; font-size: 17px; font-weight: 700; color: var(--green-text); }

/* Botones */
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 60px; padding: 12px 18px; border-radius: 16px; border: 2px solid transparent; font-size: 19px; font-weight: 700; line-height: 1.2; text-align: center; }
.btn-primary { background: var(--green); color: var(--green-on); box-shadow: var(--shadow); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.linkbtn { min-height: 48px; padding: 0 8px; background: none; border: 0; color: var(--green-text); font-size: 16px; font-weight: 700; }

/* Campos */
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label { font-size: 17px; font-weight: 700; }
.input, .amount { width: 100%; min-height: 60px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 0 16px; }
.input { font-size: 19px; }
.input[readonly] { background: var(--surface-2); color: var(--ink-2); }
.amount { display: flex; align-items: center; gap: 10px; }
.amount:focus-within { border-color: var(--blue-line); }
.amount input { flex: 1; min-width: 0; height: 56px; border: 0; background: none; outline: none; font-size: 32px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.amount span { font-weight: 700; color: var(--ink-2); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 48px; min-width: 76px; padding: 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }

/* Tarjetas */
.card { background: var(--surface); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); }
.row-card, .to-card { display: flex; align-items: center; gap: 14px; }
.row-card em, .to-card em, .contacts em, .shops em { display: block; font-style: normal; font-size: 16px; color: var(--ink-2); }
.avatar { flex: none; display: inline-grid; place-items: center; border-radius: 50%; background: var(--green-tint); color: var(--green-text); font-weight: 800; }
.verified { display: inline-flex !important; align-items: center; gap: 4px; color: var(--green-text) !important; font-weight: 700; }
.cat-ic { flex: none; display: inline-grid; place-items: center; border-radius: 14px; background: var(--green-tint); color: var(--green-text); }

/* Inicio */
.country { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); font-weight: 700; font-size: 18px; text-align: left; }
.country span { flex: 1; }
.flag { flex: none; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 1px rgba(0, 0, 0, .12); }
.balance { position: relative; overflow: hidden; padding: 18px 20px 16px; border-radius: 22px; color: #fff; background: linear-gradient(135deg, #0B4A25 0%, #11632F 55%, #1F7A3A 100%); box-shadow: 0 8px 22px rgba(11, 74, 37, .28); }
.leafmark { position: absolute; right: -18px; bottom: -22px; width: 170px; height: 170px; color: #fff; opacity: .13; }
.bal-label { position: relative; display: flex; align-items: center; gap: 4px; margin: 0; font-size: 17px; font-weight: 600; opacity: .95; }
.tipbtn { width: 44px; height: 44px; margin: -10px 0 -10px -4px; display: grid; place-items: center; background: none; border: 0; color: #fff; opacity: .9; }
.eyebtn { margin-left: auto; margin-right: -10px; }
.tip { position: relative; margin: 6px 0 0; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .16); font-size: 16px; }
.bal-usd { position: relative; margin: 2px 0 0; display: flex; align-items: baseline; gap: 8px; font-weight: 800; letter-spacing: -.03em; }
.bal-usd span { font-size: 44px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.bal-usd small { font-size: 20px; font-weight: 700; opacity: .9; letter-spacing: 0; }
.bal-ars { position: relative; margin: 10px 0 0; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, .28); font-size: 17px; font-variant-numeric: tabular-nums; opacity: .95; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 12px; min-height: 108px; padding: 14px 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); color: var(--ink); text-align: left; }
.tile-ic { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; background: var(--green-tint); color: var(--green-text); }
.tile strong { font-size: 19px; font-weight: 800; line-height: 1.15; letter-spacing: -.01em; }
.tile:active { transform: translateY(1px); }
.mycc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ccbtn { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); font-weight: 700; font-size: 17px; text-align: left; }
.ccbtn span { flex: 1; }
.ccbtn svg:last-child { color: var(--green-text); }
.sec-head { display: flex; align-items: center; justify-content: space-between; }
.sec-head h2 { margin: 0; }

/* Movimientos */
.movs { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
.movs li { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; }
.movs li + li { border-top: 1px solid var(--line); }
.mv-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mv-tx strong { font-size: 17px; font-weight: 700; line-height: 1.2; }
.mv-tx span { font-size: 15px; color: var(--ink-2); }
.mv-rate { font-size: 14px !important; }
.mv-am { flex: none; display: flex; flex-direction: column; align-items: flex-end; text-align: right; font-variant-numeric: tabular-nums; }
.mv-am b { font-size: 17px; font-weight: 800; white-space: nowrap; }
.mv-am b.pos { color: var(--green-text); }
.mv-am span { font-size: 15px; color: var(--ink-2); white-space: nowrap; }

/* Alta */
.progress { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
.progress i { display: block; height: 100%; background: var(--green); border-radius: 4px; transition: width .3s; }
.capture { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.capture .btn { min-height: 52px; font-size: 17px; }
.cap-ic { flex: none; width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--surface-2); }
.capture.is-done .cap-ic { background: var(--green-tint); color: var(--green-text); }
.cap-tx { flex: 1; min-width: 150px; display: flex; flex-direction: column; }
.cap-tx span { font-size: 16px; color: var(--ink-2); }
.faceid { align-self: center; width: 148px; height: 148px; border-radius: 36px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); color: var(--ink-2); }
.faceid.busy { color: var(--blue-ink); animation: pulse 1s ease-in-out infinite; }
.faceid.done { color: var(--green-text); background: var(--green-tint); }
.ok-line { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0; color: var(--green-text); font-weight: 700; }

/* Cobrar */
.qr-wrap { align-self: center; background: #fff; border-radius: 20px; padding: 10px; width: min(270px, 100%); box-shadow: var(--shadow); }
.qr { display: block; width: 100%; height: auto; }
.qr-amount { margin: 0; text-align: center; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.waiting { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0; color: var(--ink-2); font-size: 17px; }
.waiting i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); animation: dot 1.2s infinite ease-in-out; }
.waiting i:nth-child(2) { animation-delay: .2s; }
.waiting i:nth-child(3) { animation-delay: .4s; margin-right: 6px; }
.big-check { align-self: center; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: #fff; margin-top: 8px; }

/* Pagar */
.viewfinder { position: relative; align-self: center; width: min(280px, 100%); aspect-ratio: 1; border-radius: 22px; background: #172019; display: grid; place-items: end center; padding-bottom: 14px; overflow: hidden; }
.viewfinder span { position: relative; z-index: 1; color: #E8EEE6; font-size: 16px; }
.viewfinder .c { position: absolute; width: 34px; height: 34px; border: 4px solid #fff; }
.c.tl { top: 22px; left: 22px; border-right: 0; border-bottom: 0; border-top-left-radius: 10px; }
.c.tr { top: 22px; right: 22px; border-left: 0; border-bottom: 0; border-top-right-radius: 10px; }
.c.bl { bottom: 52px; left: 22px; border-right: 0; border-top: 0; border-bottom-left-radius: 10px; }
.c.br { bottom: 52px; right: 22px; border-left: 0; border-top: 0; border-bottom-right-radius: 10px; }
.scanline { position: absolute; left: 26px; right: 26px; height: 3px; background: #6FD08C; box-shadow: 0 0 14px #6FD08C; animation: scan 2.4s ease-in-out infinite; }
.viewfinder.busy .scanline { animation-duration: .8s; }
.demo-box { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 2px dashed var(--line); border-radius: 18px; }
.demo-box .btn { min-height: 56px; font-size: 17px; }

/* Mandar */
.contacts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.contacts button { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px; padding: 10px 14px; background: var(--surface); border: 0; border-radius: 18px; box-shadow: var(--shadow); text-align: left; }
.contacts button > span { flex: 1; min-width: 0; }
.contacts button svg:last-child { transform: rotate(180deg); color: var(--ink-2); }

/* Vender / Confirmar */
.calc > div, .lines > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; font-size: 17px; }
.calc span, .lines span { color: var(--ink-2); }
.calc b, .lines b { text-align: right; font-variant-numeric: tabular-nums; }
.calc .total, .lines .total { margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.calc .total span, .lines .total span { color: var(--ink); font-weight: 700; }
.calc .total b { font-size: 24px; font-weight: 800; }
.dest p { margin: 8px 0 0; font-size: 17px; }
.final { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; background: var(--blue-tint); border: 1px solid var(--blue-line); border-radius: 18px; }
.final span { min-width: 0; font-weight: 700; color: var(--blue-ink); }
.final b { flex: none; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.oper, .cap { margin: 0; font-size: 16px; color: var(--ink-2); }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: var(--amber-bg); border: 2px solid var(--amber-line); border-radius: 18px; color: var(--amber-ink); }
.alert svg { flex: none; margin-top: 2px; }
.alert p { margin: 0; font-size: 17px; }
.error { margin: 0; padding: 12px 14px; background: var(--red-tint); border-left: 4px solid var(--red); border-radius: 8px; color: var(--red); font-weight: 700; }
.modal { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(0, 0, 0, .55); }
.modal-in { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 34px; background: var(--surface); border-radius: 24px; }
.modal-in span { color: var(--ink-2); }

/* Comprobante */
.receipt { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
.rl { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 14px; padding: 7px 0; font-size: 16px; }
.rl span { color: var(--ink-2); }
.rl b { text-align: right; }
.rl.strong { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 12px; font-size: 18px; }
.rl.strong b { flex: none; font-size: 22px; font-weight: 800; white-space: nowrap; }
.verif { position: relative; z-index: 1; margin: 6px 0 0; font-size: 15px; color: var(--ink-2); }
.wm { position: absolute; inset: -30% -20%; display: grid; place-content: center; text-align: center; font-size: 34px; font-weight: 800; line-height: 3; letter-spacing: .1em; color: var(--ink); opacity: .06; transform: rotate(-24deg); pointer-events: none; word-spacing: .3em; }
.receipt .eyebrow { position: relative; z-index: 1; }

/* Directorio */
.chips-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.fchip { flex: none; min-height: 48px; padding: 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; font-size: 16px; font-weight: 700; white-space: nowrap; }
.fchip.on { background: var(--green); border-color: var(--green); color: var(--green-on); }
.map { display: block; width: 100%; height: auto; border-radius: 20px; box-shadow: var(--shadow); }
.m-land { fill: var(--map-land); } .m-field { fill: var(--map-field); } .m-river { fill: none; stroke: var(--map-river); stroke-width: 14; stroke-linecap: round; }
.m-town { fill: var(--map-town); } .m-casing { fill: none; stroke: var(--map-casing); stroke-width: 9; } .m-road { fill: none; stroke: var(--map-road); stroke-width: 6; }
.m-casing.thin { stroke-width: 6; } .m-road.thin { stroke-width: 3.5; }
.m-label { fill: var(--map-label); font-size: 10px; font-weight: 600; font-family: var(--sans); }
.m-me { fill: #2F6FDE; stroke: #fff; stroke-width: 3; } .m-me-ring { fill: rgba(47, 111, 222, .2); }
.pin { cursor: pointer; outline: none; }
.pin-shape { fill: var(--green); stroke: #fff; stroke-width: 1.5; }
.pin.sel .pin-shape { fill: var(--blue-line); }
.pin:focus-visible .pin-shape { stroke: var(--ink); stroke-width: 2.5; }
.shop-sel { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; background: var(--blue-tint); border: 1px solid var(--blue-line); }
.shop-sel > div { display: flex; flex-direction: column; min-width: 0; }
.shop-sel > div span { font-size: 16px; color: var(--ink-2); }
.shop-sel .btn { grid-column: 1 / -1; min-height: 52px; font-size: 17px; }
.shops { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.shops button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 68px; padding: 10px 14px; background: var(--surface); border: 2px solid transparent; border-radius: 18px; box-shadow: var(--shadow); text-align: left; }

.shops button > span { flex: 1; min-width: 0; }
.shops button b { flex: none; font-variant-numeric: tabular-nums; color: var(--ink-2); }

/* Hojas (menú y cuentas) */
.sheet-back { position: absolute; inset: 0; z-index: 40; display: flex; align-items: flex-end; background: rgba(0, 0, 0, .45); }
.sheet-card { width: 100%; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 26px 26px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }

.sheet-list { list-style: none; margin: 0; padding: 0; }
.sheet-list li + li { border-top: 1px solid var(--line); }
.sheet-list button { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 8px 4px; background: none; border: 0; font-size: 18px; font-weight: 700; text-align: left; }
.sheet-list button > span { flex: 1; }
.sheet-list em { display: block; font-style: normal; font-size: 16px; font-weight: 500; color: var(--ink-2); }
.sheet-list button svg { color: var(--green-text); }
.sheet-list button.on { color: var(--green-text); }

/* Pie legal */
.legal { margin-top: auto; padding-top: 14px; padding-bottom: 4px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.35; color: var(--ink-2); }
.legal p { margin: 0 0 4px; }

.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; background: none; border: 0; border-radius: 12px; color: var(--ink-2); font-size: 13px; font-weight: 600; }
.tabbar button.on { color: var(--green-text); }
.tabbar button.on span { font-weight: 800; }
.toast { position: absolute; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; padding: 14px 16px; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 700; text-align: center; opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.on { opacity: 1; transform: none; }

@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes dot { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.1); } }
@keyframes scan { 0%, 100% { top: 24px; } 50% { top: calc(100% - 64px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ═════════ v4 ═════════ */
a.btn { text-decoration: none; }
.btn-ghost { background: none; color: var(--green-text); border: 2px dashed var(--line); min-height: 52px; font-size: 17px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Banda de marca */
.band { flex: none; position: relative; overflow: hidden; background: var(--brand-grad); color: #fff; border-radius: 0 0 26px 26px; padding-top: 6px; padding-bottom: 18px; box-shadow: 0 8px 22px rgba(11, 74, 37, .22); }
.band::after { content: ""; position: absolute; right: -40px; top: -30px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .12), transparent 70%); pointer-events: none; }
.band-top { position: relative; display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
.band .back { color: #fff; }
.band-brand { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 16px; letter-spacing: -.02em; opacity: .95; }
.logo-mark.sm { width: 26px; height: 26px; background: rgba(255, 255, 255, .18); box-shadow: none; }
.band h1 { position: relative; margin: 4px 0 0; color: #fff; font-size: 28px; }
.band-sub { position: relative; margin: 4px 0 0; font-size: 16px; color: rgba(255, 255, 255, .88); }
.band .progress { background: rgba(255, 255, 255, .22); margin-top: 10px; }
.band .progress i { background: #fff; }
.hero { position: relative; padding-top: 2px; }

.done { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0 4px; text-align: center; }
.done-check { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--green); box-shadow: 0 0 0 8px rgba(255, 255, 255, .18); }

.contact-head { position: relative; display: flex; align-items: center; gap: 14px; padding-top: 4px; }
.contact-head > div { flex: 1; min-width: 0; }

.contact-head .avatar { background: #fff; }

/* Avatares */
.avatar { overflow: hidden; }
.avatar.cat { border-radius: 16px; }

/* Estrella de favoritos */
.star { flex: none; width: 44px; height: 44px; margin: -11px -8px -11px -4px; display: grid; place-items: center; background: none; border: 0; border-radius: 12px; }

/* Movimientos v4 */
.movs li { align-items: flex-start; gap: 12px; }
.mv-ic { flex: none; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: var(--surface-2); color: var(--ink-2); }

.mv-title { display: flex; align-items: center; gap: 2px; min-width: 0; }
.mv-name { min-width: 0; padding: 0; margin: 0; background: none; border: 0; font-size: 17px; font-weight: 700; line-height: 1.2; text-align: left; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }

.empty { margin: 0; padding: 14px 16px; border-radius: 16px; background: var(--surface-2); color: var(--ink-2); font-size: 16px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* Segmentos */

.seg.big button { min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.seg.big button small { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.seg.big button.on { outline: 2px solid var(--green); color: var(--green-text); }
.flabel { font-size: 17px; font-weight: 700; }

/* Cobrar */
.qr-card { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
.qr-head { display: flex; align-items: center; gap: 12px; }
.qr-head em { display: flex; align-items: center; gap: 6px; font-style: normal; font-size: 15px; color: var(--ink-2); }
.qr-card .qr-wrap { box-shadow: none; border: 1px solid var(--line); }

.qr-data dt { font-size: 14px; color: var(--ink-2); }
.qr-data dd { margin: 0; font-size: 16px; font-weight: 600; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px !important; word-break: break-all; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); user-select: all; }

/* Mandar */
.own-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.own { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 100px; padding: 12px 6px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.own strong { font-size: 17px; }
.own span { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.own.here { opacity: .55; box-shadow: none; cursor: default; }
.fav-row { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 8px; }
.fav { flex: none; width: 88px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; background: none; border: 0; }
.fav-av { position: relative; }
.fav-av .avatar { box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--line); }
.fav-star { position: absolute; right: -6px; bottom: -4px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); }
.fav-star svg { width: 18px; height: 18px; }
.fav-name { font-size: 14px; font-weight: 600; line-height: 1.2; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.plist { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
.plist li + li { border-top: 1px solid var(--line); }

.plist b { flex: none; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.search { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; color: var(--ink-2); }
.search:focus-within { border-color: var(--blue-line); }
.search input { flex: 1; min-width: 0; height: 52px; border: 0; background: none; outline: none; font-size: 18px; color: var(--ink); }
.area { min-height: 76px; padding: 12px 16px; font-size: 17px; resize: none; line-height: 1.35; }
.opt { font-weight: 500; color: var(--ink-2); }
.count { font-size: 14px; color: var(--ink-2); }

/* Comisión */
.fee { display: flex; flex-direction: column; gap: 2px; }
.fee-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 6px 0; font-size: 17px; }

.fee-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tag { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--blue-line); font-size: 14px; font-weight: 700; color: var(--blue-ink); opacity: .55; }

.fee-bar { display: flex; height: 10px; margin: 8px 0 4px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }

.fee-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.fee-total span { font-weight: 800; }
.fee-total b { font-size: 24px; font-weight: 800; color: var(--green-text); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Comprobante v4 */
.receipt { position: relative; overflow: hidden; padding: 18px 18px 26px; border-radius: 20px 20px 6px 6px; background: var(--surface); box-shadow: var(--shadow);
  -webkit-mask: radial-gradient(circle 8px at 50% 100%, transparent 98%, #000) 0 0 / 20px 100% repeat-x;
          mask: radial-gradient(circle 8px at 50% 100%, transparent 98%, #000) 0 0 / 20px 100% repeat-x; }
.rc-head { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; padding-bottom: 12px; border-bottom: 2px dashed var(--line); }

.rc-rows { position: relative; z-index: 1; }
.rc-rows .rl { border-top: 1px solid var(--line); }
.rc-rows .rl b { max-width: 62%; overflow-wrap: anywhere; }

@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.plist button > span.avatar, .qr-head > span.avatar, .contact-head > .avatar, .hero-to > .avatar { flex: none; }
textarea { font: inherit; color: inherit; }

.sim-note { margin: 0 0 8px; padding: 8px 10px; border-radius: 10px; background: var(--amber-bg); color: var(--amber-ink); font-size: 15px; }

.band-top { gap: 6px; }

.sheet-card .seg { margin: 6px 0 4px; }

.chip.on { background: var(--green); border-color: var(--green); color: var(--green-on); }

.wa-input { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; color: var(--green-text); }

.wa-input input { flex: 1; min-width: 0; height: 52px; border: 0; background: none; outline: none; font-size: 18px; color: var(--ink); }

/* ═════════ v6 directorio ═════════ */
.dir-controls { display: grid; grid-template-columns: 1fr 120px; gap: 10px; }
.dir-controls .field > label { font-size: 15px; }
.select-wrap { position: relative; display: flex; align-items: center; }
.select-wrap select { -webkit-appearance: none; appearance: none; width: 100%; min-height: 52px; padding: 0 40px 0 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; font: inherit; font-size: 16px; font-weight: 700; color: var(--ink); }

.legend span { display: inline-flex; align-items: center; gap: 6px; }

.avatar.colored { color: #fff; border-radius: 50%; }

/* ── v7 ── */
.hometabs { display: flex; gap: 8px; padding-top: 4px; padding-bottom: 4px; }
.hometabs button { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 16px; font-weight: 700; }

.qr-hint svg { flex: none; color: var(--green-text); }
.quote { margin-top: 18px; padding: 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.quote-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }

.quote-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
